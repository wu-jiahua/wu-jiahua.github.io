name: Deploy site

on:
  push:
    branches:
      - master
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
  pull_request:
    branches:
      - master
      - main
    paths-ignore:
      - "README.md"
      - "LICENSE"
      - ".gitignore"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
          bundler-cache: true

      - name: Build site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter

      - name: Verify local links and assets
        run: |
          python3 - <<'PY'
          import glob, os, sys, urllib.parse
          from html.parser import HTMLParser

          root = os.path.abspath("_site")
          errors = []

          class LinkChecker(HTMLParser):
              def __init__(self, html_path):
                  super().__init__()
                  self.html_path = html_path

              def handle_starttag(self, tag, attrs):
                  for key, val in attrs:
                      if key not in ("href", "src") or not val:
                          continue
                      if val.startswith(("http://", "https://", "mailto:", "tel:", "data:", "javascript:", "#")):
                          continue
                      clean = urllib.parse.unquote(val.split("#", 1)[0].split("?", 1)[0])
                      if not clean:
                          continue
                      if clean.startswith("/"):
                          target = os.path.normpath(os.path.join(root, clean.lstrip("/")))
                      else:
                          target = os.path.normpath(os.path.join(os.path.dirname(self.html_path), clean))
                      if os.path.isdir(target):
                          target = os.path.join(target, "index.html")
                      if not (os.path.isfile(target) and os.path.getsize(target) > 0):
                          errors.append(f"{self.html_path}: broken reference '{val}' -> '{target}'")

          for html_file in sorted(glob.glob(os.path.join(root, "**", "*.html"), recursive=True)):
              if html_file.startswith(os.path.join(root, "slides") + os.sep):
                  continue
              with open(html_file, encoding="utf-8") as fh:
                  LinkChecker(html_file).feed(fh.read())

          if errors:
              print("\n".join(errors), file=sys.stderr)
              sys.exit(1)
          print("Verified all local links and assets successfully.")
          PY

      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: _site
