# -----------------------------------------------------------------------------
# Jekyll & Build Settings
# -----------------------------------------------------------------------------

markdown: kramdown
kramdown:
  input: GFM

include:
  - _pages

exclude:
  - .bundle-home/
  - .gem/
  - .gem-ruby32/
  - _config.local.yml
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - vendor/

keep_files:
  - CNAME
  - .nojekyll

plugins:
  - jekyll-link-attributes
  - jekyll-sitemap

defaults:
  - scope:
      path: "assets"
    values:
      sitemap: false

sass:
  style: compressed
  sourcemap: never

external_links:
  enabled: true
  rel: external nofollow noopener
  target: _blank
